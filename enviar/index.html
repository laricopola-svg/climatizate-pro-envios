<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Enviando tu cotización · Climatízate Pro</title>
<style>
:root{--bg:#F4F6F8;--card:#FFFFFF;--ink:#16202A;--ink2:#4A5866;--ink3:#6B7887;--line:#E2E7EC;--deep:#0B1F33;--accent:#1479FF;--ok:#12805C;--okbg:#E3F4EC;--warn:#A35B00;--warnbg:#FDF1DF;--wa:#128C4A}
@media (prefers-color-scheme:dark){:root{--bg:#0A1622;--card:#132535;--ink:#E9EFF5;--ink2:#B3C1CE;--ink3:#8C9BAA;--line:#22384C;--okbg:#123327;--ok:#4CC79A;--warnbg:#3A2A12;--warn:#F2B25C;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.w{max-width:520px;margin:0 auto;padding:40px 16px}
.c{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.h{background:var(--deep);color:#fff;padding:18px 22px;font-weight:800;letter-spacing:.04em}
.h span{background:var(--accent);border-radius:4px;padding:2px 6px;font-size:13px;margin-left:6px}
.b{padding:26px 22px}
.ic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:22px;font-weight:700;margin-bottom:12px;background:var(--line);color:var(--ink2)}
.ic.ok{background:var(--okbg);color:var(--ok)}.ic.warn{background:var(--warnbg);color:var(--warn)}
.spin{width:24px;height:24px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
h1{font-size:22px;line-height:1.25;margin:0 0 10px}
p{margin:0 0 22px;color:var(--ink2)}
a.btn{display:block;text-align:center;background:var(--wa);color:#fff;text-decoration:none;font-weight:700;padding:15px;border-radius:999px}
a.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
small{display:block;text-align:center;color:var(--ink3);margin-top:14px}
</style>
</head>
<body>
<main class="w"><div class="c">
  <div class="h">CLIMATÍZATE<span>PRO</span></div>
  <div class="b" aria-live="polite">
    <div class="ic" id="ic"><div class="spin" aria-hidden="true"></div></div>
    <h1 id="t">Enviando tu cotización…</h1>
    <p id="m">Esto toma unos segundos. No cierres esta pestaña.</p>
    <a class="btn" id="wa" href="https://wa.me/56961907601" target="_blank" rel="noopener" hidden>Continuar por WhatsApp</a>
    <small id="close" hidden>Ya puedes cerrar esta pestaña.</small>
  </div>
</div></main>
<script>
(function(){
  "use strict";
  // Servicio de Google Apps Script que envía los correos.
  var EXEC = "https://script.google.com/macros/s/AKfycbzTXTH77yn8XYbpWsW9_MgaNzXLLBXs0kiSRWzvMMJctBJUWPIuEAfy7xfkgqeoQSAp/exec";
  var WA = "56961907601";
  var $ = function(id){ return document.getElementById(id); };
  var clp = function(n){ return "$" + Math.round(+n || 0).toLocaleString("es-CL"); };

  function show(ok, title, msg, d){
    var ic = $("ic"); ic.className = "ic " + (ok ? "ok" : "warn"); ic.textContent = ok ? "✓" : "!";
    $("t").textContent = title; $("m").textContent = msg;
    var txt = d && d.q
      ? "Hola Climatízate Pro, soy " + (d.n || "") + ". Quiero validar mi cotización " + d.q + (d.tot ? " por " + clp(d.tot) : "") + "."
      : "Hola Climatízate Pro, quiero cotizar la instalación de un aire acondicionado.";
    $("wa").href = "https://wa.me/" + WA + "?text=" + encodeURIComponent(txt);
    $("wa").hidden = false; $("close").hidden = false;
    document.title = title + " · Climatízate Pro";
  }

  var raw = (new URLSearchParams(location.search).get("d") || "").trim();
  if (!raw || raw.length > 14000 || !/^[A-Za-z0-9_\-=]+$/.test(raw)) {
    show(false, "No pudimos leer la cotización", "El enlace llegó incompleto. Vuelve a la web y presiona de nuevo “Enviar a mi correo”.", null);
    return;
  }
  var d = {};
  try {
    var b64 = raw.replace(/-/g, "+").replace(/_/g, "/");
    var bin = atob(b64), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    d = JSON.parse(new TextDecoder().decode(bytes)) || {};
  } catch (e) { d = {}; }

  var url = EXEC + "?fmt=json&d=" + encodeURIComponent(raw);
  var okMsg = "Enviamos el detalle de tu cotización" + (d.q ? " " + d.q : "") + (d.e ? " a " + d.e : "") + ". Si no lo ves en unos minutos, revisa spam o promociones.";
  var okTitle = "¡Listo" + (d.n ? ", " + d.n : "") + "!";

  // Sin cookies de Google: así no importa cuántas cuentas tenga abiertas el navegador.
  fetch(url, { credentials: "omit", redirect: "follow" })
    .then(function(r){ return r.json(); })
    .then(function(j){ show(!!j.ok, j.title || okTitle, j.msg || okMsg, d); })
    .catch(function(){
      // Versión del servicio sin respuesta JSON: el envío igual se realiza.
      return fetch(url, { mode: "no-cors", credentials: "omit" })
        .then(function(){ show(true, okTitle, okMsg, d); })
        .catch(function(){ show(false, "No pudimos enviar el correo", "Revisa tu conexión a internet e inténtalo de nuevo, o continúa por WhatsApp y te atendemos de inmediato.", d); });
    });
})();
</script>
</body>
</html>
